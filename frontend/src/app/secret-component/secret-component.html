<div class="secret-login-wrapper">
  <div class="secret-login-box">
    <h2>Admin Portal</h2>
    <p class="subtitle">Authorized personnel only.</p>

    <form (ngSubmit)="loginAdmin()">
      <div class="input-group">
        <label>Admin Username</label>
        <input 
          type="text" 
          name="username" 
          [(ngModel)]="username" 
          placeholder="Enter admin username" 
          required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input 
          type="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="admin-submit-btn">Access Dashboard</button>
    </form>
  </div>
</div>
